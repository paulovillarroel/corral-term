[package]
name = "corral"
version = "0.1.1"
edition = "2021"
description = "Corral: an agentic Data Science IDE in your terminal, for R and Python"
license = "MIT"
publish = false

# No dependencies on purpose: a small binary that starts in a couple of milliseconds.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
