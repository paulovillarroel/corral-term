# Corral's tests on every pull request and every push to main. The live tests
# (rs/tests/live.rs) need herdr, R, Ark and uv, so they are #[ignore]d here; the
# Live tests workflow (live.yml) runs them, or `cargo test -- --ignored` on a
# machine that has those.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rust
        run: cargo --version

      - name: Tests
        run: cargo test --locked --manifest-path rs/Cargo.toml
