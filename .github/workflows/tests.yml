# Corral's tests on every pull request and every push to main. The live tests
# (rs/tests/live.rs) need herdr, R, Ark and uv, so they are #[ignore]d here; the
# Live tests workflow (live.yml) runs them, or `cargo test -- --ignored` on a
# machine that has those.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, and macOS on Apple silicon: the code that asks the system about terminals and
  # processes is different on each (rs/src/term.rs, rs/src/os.rs), and its tests run on both.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rust
        run: cargo --version

      - name: Tests
        run: cargo test --locked --manifest-path rs/Cargo.toml
