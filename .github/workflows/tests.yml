# Corral's tests on every pull request and every push to main. The live tests
# (rs/tests/live.rs) need herdr, R and Ark, so they are #[ignore]d here; run them
# on a machine that has those with `cargo test -- --ignored`.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: cargo --version

      - name: Tests
        run: cargo test --locked --manifest-path rs/Cargo.toml
