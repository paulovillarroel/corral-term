# Corral's live tests (rs/tests/live.rs): a real herdr, R with Ark and Python,
# used the way agents use them, including the harness (approval, sensitive
# sessions, what an agent can't loosen). Setting all that up takes minutes, so
# they don't run on every pull request: run them by hand before tagging a
# version (Actions → Live tests → Run workflow), and they run when this file
# changes. Locally: cargo test --release --test live -- --ignored --test-threads 1
name: Live tests

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/live.yml"]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: herdr 0.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.9.5 -R herdrdev/herdr -p herdr-linux-x86_64 -O "$HOME/.local/bin/herdr"
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $HOME/.local/bin/herdr" | sha256sum -c
          chmod +x "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      # httpgd's system libraries, as pak::pkg_sysreqs("httpgd") lists them for Ubuntu 24.04:
      # without them its binary installs but doesn't load.
      - name: System libraries for httpgd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfontconfig1-dev libfreetype6-dev libcairo2-dev libpng-dev libtiff-dev zlib1g-dev strace

      - name: R packages
        run: |
          Rscript -e 'install.packages(c("jsonlite", "rlang", "duckdb", "DBI", "renv", "httpgd", "nanoparquet"))'
          Rscript -e 'library(httpgd); library(nanoparquet)'

      # The table viewer queries with DuckDB's command line: the version corral install
      # brings (DOWNLOADS in rs/src/install.rs), checked against its SHA-256.
      - name: DuckDB
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.gz -o "$RUNNER_TEMP/duckdb.gz"
          echo "cce2687a38681db644c248198b99ecd86170ff47e324c5f33e50c0042f142839  $RUNNER_TEMP/duckdb.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/duckdb.gz" | sudo tee /usr/local/bin/duckdb >/dev/null
          sudo chmod +x /usr/local/bin/duckdb
          duckdb --version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build corral
        run: cargo build --release --locked --manifest-path rs/Cargo.toml

      - name: Ark
        run: ./rs/target/release/corral ark --install

      # The cost reports measure, they don't check: they stay out.
      - name: Live tests
        run: cargo test --release --locked --manifest-path rs/Cargo.toml --test live -- --ignored --test-threads 1 --skip cost_report --skip restore_time_report

  # A new machine, as someone installing Corral has it: R from CRAN and nothing else of
  # Corral's (no herdr, Fresh, DuckDB, Air, uv or R packages), on macOS and on Ubuntu.
  # The installer runs on a package built here as the release builds it, the way the
  # install line gets one, and with no terminal at all: an installation must run on its
  # own, so anything that waits for an answer fails here. Then every program it brought
  # must run, and every R package it put in must load.
  install-new-machine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package: corral-term-aarch64-macos.tar.gz
          - os: ubuntu-24.04
            package: corral-term-x86_64-linux.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: The package, as the release builds it
        env:
          COPYFILE_DISABLE: "1"
        run: |
          cargo build --release --locked --manifest-path rs/Cargo.toml
          dir="$RUNNER_TEMP/package"
          mkdir -p "$dir"
          git archive --format=tar --prefix=corral-term/ HEAD | tar -x -C "$dir"
          mkdir -p "$dir/corral-term/rs/target/release"
          cp rs/target/release/corral "$dir/corral-term/rs/target/release/corral"
          tar -czf "$RUNNER_TEMP/${{ matrix.package }}" -C "$dir" corral-term
          cp install.sh "$RUNNER_TEMP/install.sh"

      - name: Install, unattended
        env:
          CORRAL_NO_TELEMETRY: "1"
          CORRAL_LANG: en
        run: |
          export CORRAL_URL="file://$RUNNER_TEMP/${{ matrix.package }}"
          CORRAL_SHA256=$( (sha256sum "$RUNNER_TEMP/${{ matrix.package }}" 2>/dev/null || shasum -a 256 "$RUNNER_TEMP/${{ matrix.package }}") | cut -d' ' -f1)
          export CORRAL_SHA256
          sh "$RUNNER_TEMP/install.sh" < /dev/null | tee "$RUNNER_TEMP/install.out"

      # What a person would do with the closing lines: run the command they name, then
      # corral install. Only when the installer names one: a new Ubuntu lacks httpgd's
      # system libraries, while a Mac needs none.
      - name: Follow the installer's advice
        env:
          CORRAL_NO_TELEMETRY: "1"
          CORRAL_LANG: en
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cmd=$(grep -o 'sudo apt install [a-z0-9 .+-]*[a-z0-9]' "$RUNNER_TEMP/install.out" | tail -n 1 || true)
          if [ -n "$cmd" ]; then
            echo "The installer said: $cmd"
            sudo apt-get update -q
            $cmd -y
            corral install < /dev/null
          fi

      - name: What it brought runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for program in corral herdr fresh duckdb air uv; do
            printf '%s: ' "$program"
            "$program" --version
          done
          "$HOME"/.local/share/corral/ark/*/ark --version
          Rscript -e 'for (p in c("jsonlite", "httpgd", "nanoparquet", "duckdb")) { suppressPackageStartupMessages(library(p, character.only = TRUE)); cat(p, format(packageVersion(p)), "\n") }'
          corral install --check

      - name: What R said while installing packages
        if: always()
        run: cat "$HOME/.local/state/corral/install-r.log" || true

  # Mirador in Safari: the browser a Mac opens it in when nobody chose another. WebKit
  # through safaridriver, driven with curl: the page loads, its script runs to the end
  # (the tabs and the plot size menu are built), and its state object is there.
  mirador-safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build corral
        run: cargo build --release --locked --manifest-path rs/Cargo.toml

      - name: Mirador in Safari
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 &
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          HOME="$home" CORRAL_MIRADOR_PORT=0 CORRAL_LANG=en ./rs/target/release/corral _mirador &
          info="$home/.local/state/corral/mirador.json"
          for _ in $(seq 100); do [ -s "$info" ] && break; sleep 0.2; done
          url=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["url"])' "$info")
          wd=http://127.0.0.1:4444
          for _ in $(seq 50); do curl -fs "$wd/status" >/dev/null && break; sleep 0.2; done
          session=$(curl -fsS -X POST "$wd/session" -H 'Content-Type: application/json' \
            -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"]["sessionId"])')
          curl -fsS -X POST "$wd/session/$session/url" -H 'Content-Type: application/json' -d "{\"url\":\"$url\"}" >/dev/null
          check='return JSON.stringify({title: document.title, state: typeof S, tabs: document.querySelector("#tabs").children.length, sizes: document.querySelector("#plotsize").options.length})'
          for _ in $(seq 50); do
            got=$(curl -fsS -X POST "$wd/session/$session/execute/sync" -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json, sys; print(json.dumps({"script": sys.argv[1], "args": []}))' "$check")" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
            echo "$got"
            python3 -c 'import json, sys; v = json.loads(sys.argv[1]); sys.exit(0 if v["title"] == "Mirador" and v["state"] == "object" and v["tabs"] > 0 and v["sizes"] > 0 else 1)' "$got" && break
            sleep 0.2
          done
          python3 -c 'import json, sys; v = json.loads(sys.argv[1]); sys.exit(0 if v["title"] == "Mirador" and v["state"] == "object" and v["tabs"] > 0 and v["sizes"] > 0 else 1)' "$got"
          curl -fsS -X DELETE "$wd/session/$session" >/dev/null
