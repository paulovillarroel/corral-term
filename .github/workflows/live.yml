# Corral's live tests (rs/tests/live.rs): a real herdr, R with Ark and Python,
# used the way agents use them, including the harness (approval, sensitive
# sessions, what an agent can't loosen). Setting all that up takes minutes, so
# they don't run on every pull request: run them by hand before tagging a
# version (Actions → Live tests → Run workflow), and they run when this file
# changes. Locally: cargo test --release --test live -- --ignored --test-threads 1
name: Live tests

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/live.yml"]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: herdr 0.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.9.5 -R herdrdev/herdr -p herdr-linux-x86_64 -O "$HOME/.local/bin/herdr"
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $HOME/.local/bin/herdr" | sha256sum -c
          chmod +x "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      # httpgd's system libraries, as pak::pkg_sysreqs("httpgd") lists them for Ubuntu 24.04:
      # without them its binary installs but doesn't load.
      - name: System libraries for httpgd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfontconfig1-dev libfreetype6-dev libcairo2-dev libpng-dev libtiff-dev zlib1g-dev strace

      - name: R packages
        run: |
          Rscript -e 'install.packages(c("jsonlite", "rlang", "duckdb", "DBI", "renv", "httpgd", "nanoparquet"))'
          Rscript -e 'library(httpgd); library(nanoparquet)'

      # The table viewer queries with DuckDB's command line: the version corral install
      # brings (DOWNLOADS in rs/src/install.rs), checked against its SHA-256.
      - name: DuckDB
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.gz -o "$RUNNER_TEMP/duckdb.gz"
          echo "cce2687a38681db644c248198b99ecd86170ff47e324c5f33e50c0042f142839  $RUNNER_TEMP/duckdb.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/duckdb.gz" | sudo tee /usr/local/bin/duckdb >/dev/null
          sudo chmod +x /usr/local/bin/duckdb
          duckdb --version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build corral
        run: cargo build --release --locked --manifest-path rs/Cargo.toml

      - name: Ark
        run: ./rs/target/release/corral ark --install

      # The cost reports measure, they don't check: they stay out.
      - name: Live tests
        run: cargo test --release --locked --manifest-path rs/Cargo.toml --test live -- --ignored --test-threads 1 --skip cost_report --skip restore_time_report

  # A new Mac, as someone installing Corral has it: R from CRAN and nothing else of
  # Corral's (no herdr, Fresh, DuckDB, Air, uv or R packages). The installer runs on a
  # package built here as the release builds it, the way the install line gets one,
  # in a terminal (script) given a few Enters, which answer yes to what it offers (two
  # questions: what's missing, and uv). Then every program it brought must run, and
  # every R package it put in must load.
  install-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: The package, as the release builds it
        env:
          COPYFILE_DISABLE: "1"
        run: |
          cargo build --release --locked --manifest-path rs/Cargo.toml
          dir="$RUNNER_TEMP/package"
          mkdir -p "$dir"
          git archive --format=tar --prefix=corral-term/ HEAD | tar -x -C "$dir"
          mkdir -p "$dir/corral-term/rs/target/release"
          cp rs/target/release/corral "$dir/corral-term/rs/target/release/corral"
          tar -czf "$RUNNER_TEMP/corral-term-aarch64-macos.tar.gz" -C "$dir" corral-term
          cp install.sh "$RUNNER_TEMP/install.sh"

      - name: Install, answering yes
        env:
          CORRAL_NO_TELEMETRY: "1"
          CORRAL_LANG: en
        run: |
          export CORRAL_URL="file://$RUNNER_TEMP/corral-term-aarch64-macos.tar.gz"
          CORRAL_SHA256=$(shasum -a 256 "$RUNNER_TEMP/corral-term-aarch64-macos.tar.gz" | cut -d' ' -f1)
          export CORRAL_SHA256
          # A finite input: script queues whatever it reads until the installer asks.
          # Its own exit status is script's, so the installer's goes to a file.
          printf '\n\n\n\n\n\n\n\n' | script -q /dev/null sh -c 'sh "$RUNNER_TEMP/install.sh"; echo $? > "$RUNNER_TEMP/install-status"' || true
          test "$(cat "$RUNNER_TEMP/install-status")" = 0

      - name: What it brought runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for program in corral herdr fresh duckdb air uv; do
            printf '%s: ' "$program"
            "$program" --version
          done
          "$HOME"/.local/share/corral/ark/*/ark --version
          Rscript -e 'for (p in c("jsonlite", "httpgd", "nanoparquet", "duckdb")) { suppressPackageStartupMessages(library(p, character.only = TRUE)); cat(p, format(packageVersion(p)), "\n") }'
          corral install --check

      - name: What R said while installing packages
        if: always()
        run: cat "$HOME/.local/state/corral/install-r.log" || true
