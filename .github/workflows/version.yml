# Each version tag (v0.1.0, v0.2.0, ...) publishes the package install.sh
# downloads: the repository plus the Rust corral already compiled, so whoever
# installs it doesn't need Rust. The binary is static (musl) and runs on any
# x86_64 Linux, WSL included.
name: Versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paquete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar corral (Rust, estático)
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl --manifest-path rs/Cargo.toml
          ./rs/target/x86_64-unknown-linux-musl/release/corral --version

      - name: Armar el paquete
        run: |
          git archive --format=tar --prefix=corral-term/ HEAD | tar -x -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/corral-term/rs/target/release"
          cp rs/target/x86_64-unknown-linux-musl/release/corral "$RUNNER_TEMP/corral-term/rs/target/release/corral"
          tar -czf corral-term-x86_64-linux.tar.gz -C "$RUNNER_TEMP" corral-term

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" corral-term-x86_64-linux.tar.gz install.sh --title "Corral $GITHUB_REF_NAME" --generate-notes
