# Each version tag (v0.1.0, v0.1.1, ...) publishes the package install.sh
# downloads: the repository plus the Rust corral already compiled, so whoever
# installs it doesn't need Rust. The binary is static (musl) and runs on any
# x86_64 Linux, WSL included.
#
# Next to the package: its SHA-256 (install.sh checks it before opening the
# package) and a build provenance attestation, so anyone can check the package
# came from this workflow: gh attestation verify FILE --repo paulovillarroel/corral-term
#
# The release notes are that version's section of CHANGELOG.md ("## 0.1.4"), with
# GitHub's link to the full list of changes below; without a section, nothing is
# published, so add it before tagging.
name: Versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  paquete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Notas de la versión (CHANGELOG.md)
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section '## $v'"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"

      - name: Compilar corral (Rust, estático)
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl --manifest-path rs/Cargo.toml
          ./rs/target/x86_64-unknown-linux-musl/release/corral --version

      - name: Armar el paquete
        run: |
          git archive --format=tar --prefix=corral-term/ HEAD | tar -x -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/corral-term/rs/target/release"
          cp rs/target/x86_64-unknown-linux-musl/release/corral "$RUNNER_TEMP/corral-term/rs/target/release/corral"
          tar -czf corral-term-x86_64-linux.tar.gz -C "$RUNNER_TEMP" corral-term
          sha256sum corral-term-x86_64-linux.tar.gz > corral-term-x86_64-linux.tar.gz.sha256
          cat corral-term-x86_64-linux.tar.gz.sha256

      - name: Atestar el origen del paquete
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: corral-term-x86_64-linux.tar.gz

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" corral-term-x86_64-linux.tar.gz corral-term-x86_64-linux.tar.gz.sha256 install.sh --title "Corral $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
