# Atajos sugeridos para ~/.config/herdr/config.toml (prefijo por defecto: ctrl+b).
# Ninguno choca con los atajos por defecto de herdr 0.9.5.
# Después de pegarlos: herdr server reload-config

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "corral.atajos"
description = "Corral: atajos y acciones (paleta)"

[[keys.command]]
key = "prefix+enter"
type = "plugin_action"
command = "corral.send"
description = "Corral: enviar selección o portapapeles a R"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "corral.close"
description = "Corral: cerrar y volver a herdr normal"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "corral.toggle"
description = "Corral: expandir script (o agente) o consola"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "corral.switch"
description = "Corral: consola de R o de Python"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "corral.plots"
description = "Corral: ver gráficos"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "corral.vars"
description = "Corral: ver variables de R"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "corral.layout"
description = "Corral: layout con foco en el agente"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "corral.layout-codigo"
description = "Corral: layout con foco en el código"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "corral.console"
description = "Corral: marcar panel como consola de R"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "corral.mirador"
description = "Corral: abrir Mirador en el navegador"
