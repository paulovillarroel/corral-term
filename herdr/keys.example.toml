# Suggested shortcuts for ~/.config/herdr/config.toml (default prefix: ctrl+b).
# None of them clashes with herdr 0.9.5's defaults.
# After pasting them: herdr server reload-config

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "corral.keys"
description = "Corral: shortcuts and actions (palette)"

[[keys.command]]
key = "prefix+enter"
type = "plugin_action"
command = "corral.send"
description = "Corral: send the selection or the clipboard to the console"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "corral.close"
description = "Corral: close and go back to plain herdr"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "corral.toggle"
description = "Corral: expand the script (or agent) or the console"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "corral.switch"
description = "Corral: R or Python console"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "corral.plots"
description = "Corral: show the plots"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "corral.vars"
description = "Corral: show the variables"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "corral.layout"
description = "Corral: layout, agent first"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "corral.layout-code"
description = "Corral: layout, code first"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "corral.console"
description = "Corral: use this pane as the console"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "corral.mirador"
description = "Corral: open Mirador in the browser"
