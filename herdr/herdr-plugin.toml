# Corral: thin herdr adapter. Every action calls Corral's command, rs/target/release/corral.
# Runtime commands run with the plugin directory as their working directory.

id = "corral"
name = "Corral"
version = "0.1.5"
min_herdr_version = "0.9.5"
description = "R and Python consoles, tables and plots next to your agents"
platforms = ["linux"]

[[actions]]
id = "layout"
title = "Corral: layout, agent first"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "layout"]

# Layouts (a group of their own in the palette): the same panes, with the script on the
# left and the agent over the console.
[[actions]]
id = "layout-code"
title = "Corral: layout, code first"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "layout", "--focus", "code"]

[[actions]]
id = "send"
title = "Corral: send the selection to the console (R or Python)"
contexts = ["selection", "pane"]
command = ["../rs/target/release/corral", "send"]

[[actions]]
id = "console"
title = "Corral: use this pane as the console"
contexts = ["pane"]
command = ["../rs/target/release/corral", "console"]

[[actions]]
id = "close"
title = "Corral: close (keeps the agent and the rest of the tab)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "close"]

[[actions]]
id = "toggle"
title = "Corral: expand the script (or agent) or the console"
contexts = ["global", "workspace", "pane"]
command = ["../rs/target/release/corral", "toggle"]

[[actions]]
id = "switch"
title = "Corral: R or Python console"
contexts = ["global", "workspace", "pane"]
command = ["../rs/target/release/corral", "switch"]

[[actions]]
id = "script"
title = "Corral: add the script editor above the console"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "script"]

[[actions]]
id = "plots"
title = "Corral: show the plots"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "plots"]

[[actions]]
id = "vars"
title = "Corral: show the variables"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "vars"]

[[actions]]
id = "mirador"
title = "Corral: open Mirador (plots and tables in the browser)"
contexts = ["global"]
command = ["../rs/target/release/corral", "mirador", "--open"]

[[actions]]
id = "keys"
title = "Corral: shortcuts and actions (palette)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "keys"]

# Corral's own themes (herdr can't install themes); choosing another one in herdr drops it.
[[actions]]
id = "theme-dark-2026"
title = "Corral: Dark 2026 theme (VS Code's and Positron's)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "theme", "dark-2026"]

[[actions]]
id = "theme-herdr"
title = "Corral: back to herdr's theme"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "theme", "herdr"]

# What agents may do in your consoles (Security model in the docs). Each title says
# what you get; Corral notifies you of the choice.
[[actions]]
id = "agents-on"
title = "Corral: agents run code without asking"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agents", "on"]

[[actions]]
id = "agents-ask"
title = "Corral: agents ask before each request"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agents", "ask"]

[[actions]]
id = "agents-off"
title = "Corral: agents can't run code"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agents", "off"]

[[actions]]
id = "output-full"
title = "Corral: agents see full results"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent_output", "full"]

[[actions]]
id = "output-review"
title = "Corral: review results before agents see them"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent_output", "review"]

[[actions]]
id = "output-structure"
title = "Corral: agents see only the structure of results"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent_output", "structure"]

# Corral's language: English by default. Commands stay in English either way. Each
# title is written in the language it switches to, so you can find yours.
[[actions]]
id = "language-en"
title = "Corral: language: English"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "language", "en"]

[[actions]]
id = "language-es"
title = "Corral: idioma: español"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "language", "es"]

[[actions]]
id = "open-url"
title = "Corral: open a local link in the browser"
contexts = ["global"]
command = ["../rs/target/release/corral", "open"]

# Viewers open on demand over the terminal and close with q or Esc.
[[panes]]
id = "plots"
title = "Corral: plots"
placement = "popup"
width = "96%"
height = "94%"
command = ["../rs/target/release/corral", "_plots"]

[[panes]]
id = "vars"
title = "Corral: variables"
placement = "popup"
width = "72%"
height = "80%"
command = ["../rs/target/release/corral", "_vars"]

# ctrl+b space: every Corral shortcut, searchable; Enter runs the actions.
[[panes]]
id = "keys"
title = "Corral: shortcuts"
placement = "popup"
width = "70%"
height = "80%"
command = ["../rs/target/release/corral", "_keys"]

# Before an agent's code runs, when you asked to approve it (corral config agents ask,
# or a session marked with corral_sensitive()). Enter runs it; n or Esc refuses.
[[panes]]
id = "approve"
title = "Corral: approve the agent's code"
placement = "popup"
width = "84%"
height = "70%"
command = ["../rs/target/release/corral", "_approve"]

# Review mode (corral config agent_output review): the result, before the agent gets
# it. Enter shares it; n keeps it, and the agent gets only its structure.
[[panes]]
id = "review"
title = "Corral: share this result with the agent?"
placement = "popup"
width = "84%"
height = "76%"
command = ["../rs/target/release/corral", "_approve"]

# `corral view` (View() in R) opens this one with CORRAL_FILE set.
[[panes]]
id = "table"
title = "Corral: table"
placement = "popup"
width = "95%"
height = "90%"
command = ["../rs/target/release/corral", "_table"]

# Ctrl+click on local URLs (`quarto preview`, httpgd, Shiny) opens them in the browser.
[[link_handlers]]
id = "local-url"
title = "Open in the browser"
pattern = '^https?://(127\.0\.0\.1|localhost):\d+(/.*)?$'
action = "open-url"
