# Corral: thin herdr adapter. Every action calls Corral's command, rs/target/release/corral.
# Runtime commands run with the plugin directory as their working directory.

id = "corral"
name = "Corral"
version = "0.1.26"
min_herdr_version = "0.9.5"
description = "R and Python consoles, tables and plots next to your agents"
platforms = ["linux"]

[[actions]]
id = "layout"
title = "Corral: layout, agent first"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "layout"]

# Layouts (a group of their own in the palette): the same panes, with the script on the
# left and the agent over the console.
[[actions]]
id = "layout-code"
title = "Corral: layout, code first"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "layout", "--focus", "code"]

# The script over the console on the left, the agent over the variables on the right.
[[actions]]
id = "layout-notebook"
title = "Corral: layout, notebook (script over the console)"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "layout", "--focus", "notebook"]

# The shell tab a new layout opens next to it (corral config terminal_tab).
[[actions]]
id = "terminal-tab-on"
title = "Corral: open a terminal tab with the layout"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "terminal_tab", "on"]

[[actions]]
id = "terminal-tab-off"
title = "Corral: no terminal tab with the layout"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "terminal_tab", "off"]

# Each layout keeps the sizes you leave; this goes back to Corral's.
[[actions]]
id = "layout-sizes"
title = "Corral: layout, back to Corral's sizes"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "layout", "--default-sizes"]

[[actions]]
id = "send"
title = "Corral: send the selection to the console (R or Python)"
contexts = ["selection", "pane"]
command = ["../rs/target/release/corral", "send"]

# The selection as SQL, in the console in view (R or Python), on DuckDB.
[[actions]]
id = "send-sql"
title = "Corral: run the selection as SQL"
contexts = ["selection", "pane"]
command = ["../rs/target/release/corral", "send", "--lang", "sql"]

[[actions]]
id = "console"
title = "Corral: use this pane as the console"
contexts = ["pane"]
command = ["../rs/target/release/corral", "console"]

[[actions]]
id = "close"
title = "Corral: close (the agent and the terminal tab too, when idle)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "close"]

[[actions]]
id = "toggle"
title = "Corral: expand the script (or agent) or the console"
contexts = ["global", "workspace", "pane"]
command = ["../rs/target/release/corral", "toggle"]

[[actions]]
id = "switch"
title = "Corral: R or Python console"
contexts = ["global", "workspace", "pane"]
command = ["../rs/target/release/corral", "switch"]

# Which R (from rig) and which Python (from uv) the consoles run, in a popup.
[[actions]]
id = "r-version"
title = "Corral: R version (rig)"
contexts = ["global", "workspace", "pane"]
command = ["../rs/target/release/corral", "versions", "r"]

[[actions]]
id = "python-version"
title = "Corral: Python version (uv)"
contexts = ["global", "workspace", "pane"]
command = ["../rs/target/release/corral", "versions", "python"]

# A crash doesn't lose the session's objects or plots: the console keeps a checkpoint.
[[actions]]
id = "checkpoints-on"
title = "Corral: keep the objects and plots if R or Python crashes"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "checkpoints", "on"]

[[actions]]
id = "checkpoints-off"
title = "Corral: don't keep checkpoints of the objects and plots"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "checkpoints", "off"]

[[actions]]
id = "script"
title = "Corral: add the script editor above the console"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "script"]

[[actions]]
id = "plots"
title = "Corral: show the plots"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "plots"]

[[actions]]
id = "vars"
title = "Corral: show the variables"
contexts = ["global", "workspace"]
command = ["../rs/target/release/corral", "vars"]

[[actions]]
id = "mirador"
title = "Corral: open Mirador (plots and tables in the browser)"
contexts = ["global"]
command = ["../rs/target/release/corral", "mirador", "--open"]

[[actions]]
id = "keys"
title = "Corral: shortcuts and actions (palette)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "keys"]

# Corral's own themes (herdr can't install themes); choosing another one in herdr drops it.
[[actions]]
id = "theme-dark-2026"
title = "Corral: Dark 2026 theme (VS Code's and Positron's)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "theme", "dark-2026"]

[[actions]]
id = "theme-herdr"
title = "Corral: back to herdr's theme"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "theme", "herdr"]

# The console a new layout starts with: R or Python (corral config start).
[[actions]]
id = "start-r"
title = "Corral: start with R"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "start", "r"]

[[actions]]
id = "start-python"
title = "Corral: start with Python"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "start", "python"]

# What agents may do in your consoles (Security model in the docs). Each title says
# what you get; Corral notifies you of the choice.
[[actions]]
id = "agents-on"
title = "Corral: agents run code without asking"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agents", "on"]

[[actions]]
id = "agents-ask"
title = "Corral: agents ask before each request"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agents", "ask"]

[[actions]]
id = "agents-off"
title = "Corral: agents can't run code"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agents", "off"]

[[actions]]
id = "output-full"
title = "Corral: agents see full results"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent_output", "full"]

[[actions]]
id = "output-review"
title = "Corral: review results before agents see them"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent_output", "review"]

[[actions]]
id = "output-structure"
title = "Corral: agents see only the structure of results"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent_output", "structure"]

# How long the audit log (what agents ran, and what came back) is kept.
[[actions]]
id = "audit-30"
title = "Corral: keep the audit log 30 days"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "audit_days", "30"]

[[actions]]
id = "audit-90"
title = "Corral: keep the audit log 90 days (Corral's)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "audit_days", "90"]

[[actions]]
id = "audit-365"
title = "Corral: keep the audit log a year"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "audit_days", "365"]

# Corral's language: English by default. Commands stay in English either way. Each
# title is written in the language it switches to, so you can find yours.
[[actions]]
id = "language-en"
title = "Corral: language: English"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "language", "en"]

[[actions]]
id = "language-es"
title = "Corral: idioma: español"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "language", "es"]

# The agent the layout opens in its agent pane (corral config agent).
[[actions]]
id = "agent-claude"
title = "Corral: the agent pane runs Claude Code"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent", "claude"]

[[actions]]
id = "agent-codex"
title = "Corral: the agent pane runs Codex"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent", "codex"]

[[actions]]
id = "agent-gemini"
title = "Corral: the agent pane runs Gemini CLI"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent", "gemini"]

[[actions]]
id = "agent-opencode"
title = "Corral: the agent pane runs opencode"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent", "opencode"]

[[actions]]
id = "agent-none"
title = "Corral: no agent, a shell in the agent pane"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "agent", "none"]

# The size Mirador draws R plots at: its window's, or fixed.
[[actions]]
id = "plot-size-window"
title = "Corral: Mirador draws plots to fit its window"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "plot_size", "window"]

[[actions]]
id = "plot-size-800"
title = "Corral: Mirador draws plots at 800 × 500"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "plot_size", "800x500"]

[[actions]]
id = "plot-size-1000"
title = "Corral: Mirador draws plots at 1000 × 650"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "plot_size", "1000x650"]

[[actions]]
id = "plot-size-1200"
title = "Corral: Mirador draws plots at 1200 × 800"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "plot_size", "1200x800"]

# Corral's latest version, with the install line, in a popup.
# What an agent sees here (corral context), in a popup.
[[actions]]
id = "context"
title = "Corral: what your agent sees"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "context"]

[[actions]]
id = "update"
title = "Corral: update to the latest version"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "update"]

# Whether opening the workspace says when there is a newer version (corral config update_check).
[[actions]]
id = "update-check-on"
title = "Corral: tell me when there is a new version"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "update_check", "on"]

[[actions]]
id = "update-check-off"
title = "Corral: don't check for new versions"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "update_check", "off"]

# The installer's anonymous install count (corral config telemetry).
[[actions]]
id = "telemetry-on"
title = "Corral: count my installs anonymously"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "telemetry", "on"]

[[actions]]
id = "telemetry-off"
title = "Corral: don't count my installs"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../rs/target/release/corral", "config", "telemetry", "off"]

[[actions]]
id = "open-url"
title = "Corral: open a local link in the browser"
contexts = ["global"]
command = ["../rs/target/release/corral", "open"]

# Viewers open on demand over the terminal and close with q or Esc.
[[panes]]
id = "plots"
title = "Corral: plots"
placement = "popup"
width = "96%"
height = "94%"
command = ["../rs/target/release/corral", "_plots"]

[[panes]]
id = "vars"
title = "Corral: variables"
placement = "popup"
width = "72%"
height = "80%"
command = ["../rs/target/release/corral", "_vars"]

# ctrl+b space: every Corral shortcut, searchable; Enter runs the actions.
[[panes]]
id = "keys"
title = "Corral: shortcuts"
placement = "popup"
width = "70%"
height = "80%"
command = ["../rs/target/release/corral", "_keys"]

# What an agent sees here: consoles, SQL and its rules (corral context).
[[panes]]
id = "context"
title = "Corral: what your agent sees"
placement = "popup"
width = "70%"
height = "40%"
command = ["../rs/target/release/corral", "_context"]

# Corral's latest version, installed in a popup with the install line.
[[panes]]
id = "update"
title = "Corral: update"
placement = "popup"
width = "70%"
height = "70%"
command = ["../rs/target/release/corral", "_update"]

# The installed R (rig) or Python (uv) versions; Enter uses one.
[[panes]]
id = "versions-r"
title = "Corral: R version"
placement = "popup"
width = "64%"
height = "50%"
command = ["../rs/target/release/corral", "_versions", "r"]

[[panes]]
id = "versions-python"
title = "Corral: Python version"
placement = "popup"
width = "64%"
height = "50%"
command = ["../rs/target/release/corral", "_versions", "python"]

# Before an agent's code runs, when you asked to approve it (corral config agents ask,
# or a session marked with corral_sensitive()). Enter runs it; n or Esc refuses.
[[panes]]
id = "approve"
title = "Corral: approve the agent's code"
placement = "popup"
width = "84%"
height = "70%"
command = ["../rs/target/release/corral", "_approve"]

# Review mode (corral config agent_output review): the result, before the agent gets
# it. Enter shares it; n keeps it, and the agent gets only its structure.
[[panes]]
id = "review"
title = "Corral: share this result with the agent?"
placement = "popup"
width = "84%"
height = "76%"
command = ["../rs/target/release/corral", "_approve"]

# An agent's shell asks to loosen the harness (corral config agents on): the user decides.
[[panes]]
id = "setting"
title = "Corral: an agent wants to change a setting"
placement = "popup"
width = "64%"
height = "40%"
command = ["../rs/target/release/corral", "_approve"]

# `corral view` (View() in R) opens this one with CORRAL_FILE set.
[[panes]]
id = "table"
title = "Corral: table"
placement = "popup"
width = "95%"
height = "90%"
command = ["../rs/target/release/corral", "_table"]

# Ctrl+click on local URLs (`quarto preview`, httpgd, Shiny) opens them in the browser.
[[link_handlers]]
id = "local-url"
title = "Open in the browser"
pattern = '^https?://(127\.0\.0\.1|localhost):\d+(/.*)?$'
action = "open-url"
