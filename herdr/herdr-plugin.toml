# Corral: thin herdr adapter. Every action calls Corral's command (../bin/corral-run runs it).
# Runtime commands run with the plugin directory as their working directory.

id = "corral"
name = "Corral"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Consola de R, tablas y gráficos junto a tus agentes"
platforms = ["linux"]

[[actions]]
id = "layout"
title = "Corral: layout con foco en el agente"
contexts = ["global", "workspace"]
command = ["../bin/corral-run", "layout"]

# Layouts (a group of their own in the palette): the same panes, with the script on the
# left and the agent over the console.
[[actions]]
id = "layout-codigo"
title = "Corral: layout con foco en el código"
contexts = ["global", "workspace"]
command = ["../bin/corral-run", "layout", "--foco", "codigo"]

[[actions]]
id = "send"
title = "Corral: enviar la selección a la consola (R o Python)"
contexts = ["selection", "pane"]
command = ["../bin/corral-run", "send"]

[[actions]]
id = "console"
title = "Corral: usar este panel como consola"
contexts = ["pane"]
command = ["../bin/corral-run", "console"]

[[actions]]
id = "close"
title = "Corral: cerrar (deja a Claude y el resto de la pestaña)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../bin/corral-run", "close"]

[[actions]]
id = "toggle"
title = "Corral: expandir script (o agente) o consola"
contexts = ["global", "workspace", "pane"]
command = ["../bin/corral-run", "toggle"]

[[actions]]
id = "switch"
title = "Corral: consola de R o de Python"
contexts = ["global", "workspace", "pane"]
command = ["../bin/corral-run", "switch"]

[[actions]]
id = "script"
title = "Corral: agregar el editor de scripts sobre la consola"
contexts = ["global", "workspace"]
command = ["../bin/corral-run", "script"]

[[actions]]
id = "plots"
title = "Corral: ver los gráficos"
contexts = ["global", "workspace"]
command = ["../bin/corral-run", "plots"]

[[actions]]
id = "vars"
title = "Corral: ver las variables"
contexts = ["global", "workspace"]
command = ["../bin/corral-run", "vars"]

[[actions]]
id = "mirador"
title = "Corral: abrir Mirador (gráficos y tablas en el navegador)"
contexts = ["global"]
command = ["../bin/corral-run", "mirador", "--open"]

[[actions]]
id = "atajos"
title = "Corral: atajos y acciones (paleta)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../bin/corral-run", "atajos"]

# Corral's own themes (herdr can't install themes); choosing another one in herdr drops it.
[[actions]]
id = "tema-dark-2026"
title = "Corral: tema Dark 2026 (el de VS Code y Positron)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../bin/corral-run", "config", "tema", "dark-2026"]

[[actions]]
id = "tema-herdr"
title = "Corral: volver al tema de herdr"
contexts = ["global", "workspace", "tab", "pane"]
command = ["../bin/corral-run", "config", "tema", "herdr"]

[[actions]]
id = "open-url"
title = "Corral: abrir enlace local en el navegador"
contexts = ["global"]
command = ["../bin/corral-run", "open"]

# Viewers open on demand over the terminal and close with q or Esc.
[[panes]]
id = "plots"
title = "Corral: gráficos"
placement = "popup"
width = "96%"
height = "94%"
command = ["../bin/corral-run", "_plots"]

[[panes]]
id = "vars"
title = "Corral: variables"
placement = "popup"
width = "72%"
height = "80%"
command = ["../bin/corral-run", "_vars"]

# ctrl+b space: every Corral shortcut, searchable; Enter runs the actions.
[[panes]]
id = "atajos"
title = "Corral: atajos"
placement = "popup"
width = "70%"
height = "80%"
command = ["../bin/corral-run", "_atajos"]

# `corral view` (View() in R) opens this one with CORRAL_FILE set.
[[panes]]
id = "table"
title = "Corral: tabla"
placement = "popup"
width = "95%"
height = "90%"
command = ["../bin/corral-run", "_table"]

# Ctrl+click on local URLs (`quarto preview`, httpgd, Shiny) opens them in the browser.
[[link_handlers]]
id = "local-url"
title = "Abrir en el navegador"
pattern = '^https?://(127\.0\.0\.1|localhost):\d+(/.*)?$'
action = "open-url"
